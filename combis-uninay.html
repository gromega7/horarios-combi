<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¿A qué hora pasa? · UniNay Moctezuma</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f6fa;--card:#fff;--tx:#111827;--mu:#6b7280;--bd:#e2e6ee;--hd:#0f172a;
--c1:#dbe8ff;--t1:#1d4ed8;--c2:#d9f7e6;--t2:#15803d;--c3:#fdf0c4;--t3:#a16207;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#151c30;--tx:#eef1f8;--mu:#9aa4b8;--bd:#252e47;--hd:#050814;
--c1:#1e3a8a;--t1:#bfd4ff;--c2:#14532d;--t2:#bbf7d0;--c3:#713f12;--t3:#fde68a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1020;--card:#151c30;--tx:#eef1f8;--mu:#9aa4b8;--bd:#252e47;--hd:#050814;--c1:#1e3a8a;--t1:#bfd4ff;--c2:#14532d;--t2:#bbf7d0;--c3:#713f12;--t3:#fde68a;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:560px;margin:0 auto;padding-bottom:30px}
header{background:var(--hd);color:#fff;padding:18px 16px 16px;border-radius:0 0 22px 22px}
h1{margin:0;font-size:22px}header p{margin:4px 0 0;color:#aab4c8;font-size:14px}
main{padding:14px}
label{font-size:13px;color:var(--mu);font-weight:600}
select{width:100%;font-size:18px;padding:13px;margin:6px 0 12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.warn{background:var(--c3);color:var(--t3);padding:10px 12px;border-radius:12px;margin-bottom:12px;font-size:14px}
.next{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:10px}
.next.first{border-width:2px;border-color:var(--tx)}
.tag{display:inline-block;padding:5px 11px;border-radius:999px;font-weight:700;font-size:14px}
.c1{background:var(--c1);color:var(--t1)}.c2{background:var(--c2);color:var(--t2)}.c3{background:var(--c3);color:var(--t3)}
.hr{font-size:26px;font-weight:800}.min{text-align:right;color:var(--mu);font-size:14px}.min b{display:block;font-size:20px;color:var(--tx)}
h2{font-size:15px;margin:20px 0 8px;color:var(--mu)}
.list{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 10px;border-radius:10px;font-size:14px;font-variant-numeric:tabular-nums}
.past{opacity:.35}
.empty{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;text-align:center;color:var(--mu)}
footer{padding:0 16px;color:var(--mu);font-size:12px}
</style></head><body>
<header><h1>¿A qué hora pasa?</h1><p>UniNay Moctezuma · Lunes a sábado · 101 Said, 146 Carlos, 253 Jorge</p></header>
<main>
<label for="s">¿En qué punto estás?</label>
<select id="s"></select>
<div id="w"></div><div id="n"></div>
<h2>Todo el día en esta parada</h2><div class="list" id="l"></div>
</main>
<footer>Horarios tomados de las tablas de los concesionarios. Son horarios programados: el tráfico puede mover la hora real. Proyecto comunitario no oficial.</footer>
<script>
const S=["Las Brisas","Iglesia","Fovissste","Estadios","Durango","La Fuente","La Penal","Libramiento","Salida Félix Peña","Autos","Fuente Regreso","Coppel Puebla","Estadios Regreso","Ley Rodeo"];
const O=[0,7,11,18,25,33,39,48,56,65,71,79,87,93];
const C={"101 Said":"c1","146 Carlos":"c2","253 Jorge":"c3"};
const T=[];
for(let k=0;k<10;k++){
  T.push({c:"101 Said",s:330+100*k,a:0,b:13});
  T.push({c:"146 Carlos",s:363+100*k,a:0,b:k==9?9:13});
  T.push({c:"253 Jorge",s:397+100*k,a:0,b:k==9?4:13});
}
T.push({c:"146 Carlos",s:263,a:10,b:13});
T.push({c:"253 Jorge",s:297,a:5,b:13});
const f=m=>{const h=Math.floor(m/60),mm=String(m%60).padStart(2,"0");return((h+11)%12+1)+":"+mm+(h<12?" AM":" PM")};
const sel=document.getElementById("s");
S.forEach((n,i)=>{const o=document.createElement("option");o.value=i;o.textContent=n;sel.appendChild(o)});
try{const v=localStorage.getItem("stop");if(v!==null)sel.value=v}catch(e){}
function draw(){
  const i=+sel.value,d=new Date(),sun=d.getDay()==0;
  const now=sun?-1:d.getHours()*60+d.getMinutes();
  try{localStorage.setItem("stop",i)}catch(e){}
  const L=T.filter(t=>i>=t.a&&i<=t.b).map(t=>({c:t.c,t:t.s+O[i]})).sort((x,y)=>x.t-y.t);
  document.getElementById("w").innerHTML=sun?'<div class="warn">Hoy es domingo: según las tablas no hay servicio. Abajo ves el horario de lunes a sábado.</div>':"";
  const nx=L.filter(x=>x.t>=now).slice(0,3);
  document.getElementById("n").innerHTML=nx.length?nx.map((x,j)=>{const r=x.t-now;
    return '<div class="next'+(j==0?' first':'')+'"><div><span class="tag '+C[x.c]+'">'+x.c+'</span><div class="hr">'+f(x.t)+'</div></div><div class="min"><b>'+(sun?"":(r<=0?"¡Ahora!":"en "+(r>=60?Math.floor(r/60)+" h "+r%60:r)+" min"))+'</b>'+(j==0?"próxima":"")+'</div></div>'}).join(""):'<div class="empty">Ya no pasan más combis hoy por esta parada.<br>Primera de mañana: <b>'+f(L[0].t)+'</b> ('+L[0].c+')</div>';
  document.getElementById("l").innerHTML=L.map(x=>'<span class="chip '+C[x.c]+(x.t<now?' past':'')+'">'+f(x.t)+'</span>').join("");
}
sel.onchange=draw;draw();setInterval(draw,30000);
</script></body></html>
